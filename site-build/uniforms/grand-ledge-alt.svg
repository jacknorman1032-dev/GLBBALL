<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 285" width="160" height="285" role="img" aria-label="Grand Ledge alternate uniform">
  <defs>
    <clipPath id="glxJerseyClip"><path d="M40,10 L54,10 L80,34 L106,10 L120,10 L120,40 Q122,68 138,78 L138,166 L22,166 L22,78 Q38,68 40,40 Z"/></clipPath>
    <clipPath id="glxShortsClip"><path d="M22,160 L138,160 L146,275 L92,275 L80,228 L68,275 L14,275 Z"/></clipPath>
  </defs>

  <!-- Shorts: black, wide navy panel down the outer side of each leg -->
  <path d="M22,160 L138,160 L146,275 L92,275 L80,228 L68,275 L14,275 Z" fill="#15171c"/>
  <g clip-path="url(#glxShortsClip)" fill="#2a3d66">
    <polygon points="10,160 33,160 26,276 2,276"/>
    <polygon points="127,160 150,160 158,276 134,276"/>
  </g>
  <path d="M22,160 L138,160 L146,275 L92,275 L80,228 L68,275 L14,275 Z" fill="none" stroke="#111" stroke-width="2" stroke-linejoin="round"/>

  <!-- Jersey: black, wide navy side panels from the armholes down, thin navy neck and armhole binding -->
  <path d="M40,10 L54,10 L80,34 L106,10 L120,10 L120,40 Q122,68 138,78 L138,166 L22,166 L22,78 Q38,68 40,40 Z" fill="#15171c"/>
  <g clip-path="url(#glxJerseyClip)">
    <path d="M10,60 L32,60 Q31,110 33,168 L10,168 Z" fill="#2a3d66"/>
    <path d="M150,60 L128,60 Q129,110 127,168 L150,168 Z" fill="#2a3d66"/>
    <g fill="none" stroke="#2a3d66" stroke-width="5">
      <path d="M54,10 L80,34 L106,10"/>
      <path d="M40,10 L40,40 Q38,68 22,78"/>
      <path d="M120,10 L120,40 Q122,68 138,78"/>
    </g>
  </g>
  <path d="M40,10 L54,10 L80,34 L106,10 L120,10 L120,40 Q122,68 138,78 L138,166 L22,166 L22,78 Q38,68 40,40 Z" fill="none" stroke="#111" stroke-width="2" stroke-linejoin="round"/>

  <!-- small white serif GL on the shorts waistband -->
  <g font-family="Georgia, 'Times New Roman', serif" font-weight="700" fill="#f4f6fa" font-size="8.5">
    <text x="76.6" y="175.5" text-anchor="middle">G</text><text x="82.4" y="179" text-anchor="middle">L</text>
  </g>

  <!-- Lettering: straight condensed COMETS and number in white -->
  <text x="80" y="78" text-anchor="middle" textLength="62" lengthAdjust="spacingAndGlyphs" font-family="'Arial Narrow', 'Roboto Condensed', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="17" fill="#f4f6fa">COMETS</text>
  <text x="80" y="124" text-anchor="middle" font-family="'Arial Narrow', 'Roboto Condensed', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="42" fill="#f4f6fa">0</text>
</svg>
