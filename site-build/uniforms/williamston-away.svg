    <path d="M0,270.5 L68,270.5 M92,270.5 L160,270.5" stroke="#1a8064" stroke-width="5"/>
  </g>
  <path d="M22,160 L138,160 L146,275 L92,275 L80,228 L68,275 L14,275 Z" fill="none" stroke="#111" stroke-width="2" stroke-linejoin="round"/>
  <text x="41" y="263" text-anchor="middle" font-family="Rockwell, 'Roboto Slab', Georgia, 'Times New Roman', serif" font-weight="700" font-size="20" fill="#1a8064" stroke="#ffffff" stroke-width="1.6" paint-order="stroke">W</text>

  <!-- Jersey: black, green V-neck and armhole binding, green side stripe edged in white -->
