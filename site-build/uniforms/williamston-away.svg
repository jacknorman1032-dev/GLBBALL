    <clipPath id="wiaShortsClip"><path d="M22,160 L138,160 L146,275 L92,275 L80,228 L68,275 L14,275 Z"/></clipPath>
  </defs>

  <!-- Shorts: black, green side stripe edged in white, green hem band, serif W in green outlined in white on the right leg (viewer's left) -->
