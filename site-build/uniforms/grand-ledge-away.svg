    <clipPath id="glaShortsClip"><path d="M22,160 L138,160 L146,275 L92,275 L80,228 L68,275 L14,275 Z"/></clipPath>
  </defs>

  <!-- Shorts: navy, gold-and-white side stripes, white hem piping -->
  <path d="M22,160 L138,160 L146,275 L92,275 L80,228 L68,275 L14,275 Z" fill="#1c2a48"/>
  <g clip-path="url(#glaShortsClip)">
