    <text x="46.2" y="78.6" transform="rotate(-11.9 46.2 78.6)">G</text><text x="53.5" y="77.2" transform="rotate(-9.4 53.5 77.2)">R</text><text x="60.7" y="76.2" transform="rotate(-6.9 60.7 76.2)">A</text><text x="68.1" y="75.4" transform="rotate(-4.3 68.1 75.4)">N</text><text x="75.7" y="75.1" transform="rotate(-1.6 75.7 75.1)">D</text><text x="86.6" y="75.1" transform="rotate(2.4 86.6 75.1)">L</text><text x="92.8" y="75.5" transform="rotate(4.6 92.8 75.5)">E</text><text x="99.8" y="76.2" transform="rotate(7.1 99.8 76.2)">D</text><text x="107.4" y="77.3" transform="rotate(9.7 107.4 77.3)">G</text><text x="114.4" y="78.7" transform="rotate(12.1 114.4 78.7)">E</text>
