    <g fill="none">
      <path d="M54,10 L80,34 L106,10" stroke="#ffffff" stroke-width="10"/>
      <path d="M54,10 L80,34 L106,10" stroke="#f0b323" stroke-width="7"/>
      <g stroke="#ffffff" stroke-width="7"><path d="M40,10 L40,40 Q38,68 22,78"/><path d="M120,10 L120,40 Q122,68 138,78"/></g>
