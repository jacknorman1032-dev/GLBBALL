    <path d="M0,268 L68,268 M92,268 L160,268" stroke="#ffffff" stroke-width="2.4"/>
  </g>
  <path d="M22,160 L138,160 L146,275 L92,275 L80,228 L68,275 L14,275 Z" fill="none" stroke="#111" stroke-width="2" stroke-linejoin="round"/>

  <!-- Jersey: navy, gold V-neck and armholes edged in white, gold-and-white side stripes -->
  <path d="M40,10 L54,10 L80,34 L106,10 L120,10 L120,40 Q122,68 138,78 L138,166 L22,166 L22,78 Q38,68 40,40 Z" fill="#1c2a48"/>
  <g clip-path="url(#glaJerseyClip)">
