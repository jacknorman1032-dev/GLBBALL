    <text x="76.6" y="175.5" text-anchor="middle">G</text><text x="82.4" y="179" text-anchor="middle">L</text>
  </g>

  <!-- Lettering: slightly arched condensed GRAND LEDGE hollow (navy with gold outline); number hollow too -->
